name: Validate GafiGPT UI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check content.js
      - name: Run static project audit
        run: node audit.mjs
      - name: Validate extension structure
        run: |
          test -f manifest.json
          test -f content.js
          test -f styles.css
          test -f fixes.css
          test -f popup.html
      - name: Package extension
        run: zip -r GafiGPT-UI.zip manifest.json content.js styles.css fixes.css popup.html README.md audit.mjs
      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: GafiGPT-UI
          path: GafiGPT-UI.zip
          retention-days: 3
